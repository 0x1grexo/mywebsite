<script>
  /*
  * For sharing storage across domains
  * */
  window.onmessage = function(e) {
    const sharedIframeOrigin = window.location.origin;
    const isSharedIframeOriginDelfi = sharedIframeOrigin.endsWith('.delfi.ee')
    const isEventOriginDelfi = e.origin.endsWith('.delfi.ee');
    const isDataTypeValid = typeof e.data === 'string';

    if (isSharedIframeOriginDelfi && (!isEventOriginDelfi || !isDataTypeValid)) {
      return
    }

    let payload;

    try {
      payload = JSON.parse(e.data);
    } catch(e) {
      console.log('shared.html failed ot parse payload', e);
      return;
    }


    if (payload.type === 'save') {
      localStorage.setItem(payload.storageKey, JSON.stringify(payload.data));
    }
    if (payload.type === 'get') {
      const data = localStorage.getItem(payload.storageKey);
      e.source.postMessage({ type: 'getResponse', value: data }, '*');
    }
  };
</script>
