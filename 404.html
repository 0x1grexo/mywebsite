<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lehte ei leitud</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background: url('images/404.png') no-repeat center center fixed;
            background-size: cover;
            color: #ecf0f1;
            text-align: center;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1 { 
            color: #fff; 
            font-size: 5rem; 
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p { 
            font-size: 1.2rem; 
            background: rgba(0, 0, 0, 0.4);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 4px;
            margin: 5px 0;
        }
        .btn { 
            display: inline-block; 
            padding: 12px 24px; 
            background: #3498db; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            margin-top: 20px; 
            transition: background 0.3s ease, transform 0.2s;
        }
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        footer {
            width: 100%;
            padding: 20px 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>404</h1>
        <div>
            <p>Ups! Tundub, et oled eksinud.</p><br>
            <p>Oops! It seems you are lost.</p>
        </div>
        <a href="https://gregoropmann.github.io/aboutme/" class="btn">Tagasi avalehele / Back Home</a>
    </div>
    
    <footer>
        &copy; <span id="current-year"></span> Gregor Opmann · GitHub Pages
    </footer>
    
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
    
</body>
</html>
